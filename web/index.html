<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Trainer</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="logo.png" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/board.css" />
    <link rel="stylesheet" href="css/panel.css" />
    <script type="importmap">
      { "imports": { "@badrap/result": "./js/vendor/badrap-result.js" } }
    </script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" src="logo.svg" alt="Chess Trainer" width="95" height="95" />
          <select id="locale-picker" class="locale-picker" data-i18n-label="locale.label"></select>
        </div>

        <nav id="sidebar-tabs" class="menu">
          <button id="tab-new" class="tab active" type="button" disabled data-i18n="menu.newGame"></button>
          <button id="tab-saved" class="tab" type="button" disabled data-i18n="menu.saved"></button>
          <button id="tab-openings" class="tab" type="button" disabled data-i18n="menu.openings"></button>
          <button id="tab-import" class="tab" type="button" disabled data-i18n="menu.import"></button>
        </nav>

        <div class="side-panel">
          <section id="openings-card" class="card" hidden>
            <h2 data-i18n="menu.openings"></h2>
            <p class="hint" data-i18n="openings.help"></p>
            <input id="lines-search" class="search" type="search" data-i18n-placeholder="setup.search" autocomplete="off" />
            <div class="selection-line">
              <span id="lines-total" class="hint"></span>
              <span class="link-row">
                <button id="lines-select-all" class="link-button" type="button" data-i18n="setup.selectAll"></button>
                <button id="lines-clear" class="link-button" type="button" hidden data-i18n="setup.clear"></button>
              </span>
            </div>
            <div id="lines-tree" class="openings"></div>
            <p id="lines-no-matches" class="hint" hidden data-i18n="setup.noMatches"></p>
            <p id="lines-error" class="error" role="alert" hidden></p>
            <button id="lines-export" class="button button-primary button-wide" type="button" disabled></button>
          </section>

          <section id="import-card" class="card" hidden>
            <h2 data-i18n="import.title"></h2>
              <form id="import-remote" class="import-remote">
                <h3 class="import-subtitle" data-i18n="import.remote.title"></h3>
                <div class="field-row">
                  <select id="import-site" data-i18n-label="import.remote.site">
                    <option value="chesscom">Chess.com</option>
                    <option value="lichess">Lichess</option>
                  </select>
                  <select id="import-months" data-i18n-label="import.remote.period">
                    <option value="1" data-i18n="import.remote.months1"></option>
                    <option value="3" data-i18n="import.remote.months3"></option>
                    <option value="6" data-i18n="import.remote.months6"></option>
                    <option value="12" data-i18n="import.remote.months12"></option>
                  </select>
                </div>
                <input id="import-username" class="search" type="text" required maxlength="30" pattern="[A-Za-z0-9][A-Za-z0-9_\-]*" autocomplete="off" spellcheck="false" data-i18n-placeholder="import.remote.username" data-i18n-label="import.remote.username" />
                <div class="button-row">
                  <button id="import-fetch" class="button button-primary" type="submit" data-i18n="import.remote.fetch"></button>
                </div>
                <p class="hint" data-i18n="import.remote.hint"></p>
                <p id="import-remote-summary" class="hint import-result" hidden></p>
                <ul id="import-remote-errors" class="import-errors"></ul>
              </form>
              <h3 class="import-subtitle" data-i18n="import.pasteTitle"></h3>
              <textarea id="import-text" class="search import-text" rows="5" data-i18n-placeholder="import.placeholder"></textarea>
              <div class="button-row">
                <button id="import-paste" class="button button-primary" type="button" data-i18n="import.paste"></button>
                <label class="button import-file"><span data-i18n="import.file"></span><input id="import-file" type="file" accept=".pgn,.txt,text/plain,application/x-chess-pgn" hidden /></label>
              </div>
              <p id="import-summary" class="hint" hidden></p>
              <ul id="import-errors" class="import-errors"></ul>
            </section>

          <section id="saved-card" class="card" hidden>
            <h2 data-i18n="tabs.saved"></h2>
            <input id="saved-search" class="search" type="search" data-i18n-placeholder="saved.search" autocomplete="off" />
            <div class="field-row">
              <select id="saved-color" data-i18n-label="saved.colorFilter">
                <option value="" data-i18n="saved.anyColor"></option>
                <option value="white" data-i18n="setup.white"></option>
                <option value="black" data-i18n="setup.black"></option>
              </select>
              <select id="saved-result" data-i18n-label="saved.resultFilter">
                <option value="" data-i18n="saved.anyResult"></option>
                <option value="win" data-i18n="saved.result.win"></option>
                <option value="draw" data-i18n="saved.result.draw"></option>
                <option value="loss" data-i18n="saved.result.loss"></option>
              </select>
            </div>
            <div class="selection-line">
              <label class="toggle"><input id="saved-select-all" type="checkbox" /><span id="saved-count" class="hint"></span></label>
            </div>
            <div id="saved-list" class="saved-list"></div>
            <p id="saved-empty" class="hint" hidden></p>
            <p id="saved-error" class="error" role="alert" hidden></p>
            <div class="button-row saved-actions">
              <button id="saved-export" class="button button-primary" type="button" disabled></button>
              <button id="saved-delete" class="button button-danger" type="button" disabled></button>
            </div>
          </section>

        <section id="setup-card" class="card">
          <h2 data-i18n="setup.title"></h2>

          <div class="segmented">
            <label><input type="radio" name="new-mode" value="opening" checked disabled /><span data-i18n="setup.mode.opening"></span></label>
            <label><input type="radio" name="new-mode" value="saved" disabled /><span data-i18n="setup.mode.saved"></span></label>
            <label><input type="radio" name="new-mode" value="chess960" disabled /><span data-i18n="setup.mode.chess960"></span></label>
          </div>

          <fieldset class="field">
            <legend data-i18n="setup.color"></legend>
            <div class="segmented">
              <label><input type="radio" name="color" value="white" /><span data-i18n="setup.white"></span></label>
              <label><input type="radio" name="color" value="black" /><span data-i18n="setup.black"></span></label>
            </div>
          </fieldset>

          <fieldset id="openings-field" class="field">
            <legend data-i18n="setup.openings"></legend>
            <input id="opening-search" class="search" type="search" data-i18n-placeholder="setup.search" autocomplete="off" />
            <div class="selection-line">
              <span id="selected-total" class="hint"></span>
              <span class="link-row">
                <button id="select-all" class="link-button" type="button" data-i18n="setup.selectAll"></button>
                <button id="clear-selection" class="link-button" type="button" hidden data-i18n="setup.clear"></button>
              </span>
            </div>
            <div id="openings" class="openings"></div>
            <p id="no-matches" class="hint" hidden data-i18n="setup.noMatches"></p>
          </fieldset>

          <fieldset id="chess960" class="field" hidden>
            <legend data-i18n="chess960.title"></legend>
            <div class="chess960-row">
              <button id="chess960-roll" class="button" type="button">
                <svg class="dice" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2" />
                  <circle cx="8" cy="8" r="1.6" fill="currentColor" />
                  <circle cx="16" cy="8" r="1.6" fill="currentColor" />
                  <circle cx="12" cy="12" r="1.6" fill="currentColor" />
                  <circle cx="8" cy="16" r="1.6" fill="currentColor" />
                  <circle cx="16" cy="16" r="1.6" fill="currentColor" />
                </svg>
                <span data-i18n="chess960.roll"></span>
              </button>
              <span id="chess960-number" class="hint"></span>
            </div>
            <form id="chess960-fen-form" class="chess960-row">
              <input id="chess960-fen" class="search" type="text" data-i18n-placeholder="chess960.fenPlaceholder" autocomplete="off" spellcheck="false" />
              <button class="button" type="submit" data-i18n="chess960.useFen"></button>
            </form>
            <p id="chess960-error" class="error" hidden data-i18n="chess960.invalidFen"></p>
            <p class="hint" data-i18n="chess960.castling"></p>
          </fieldset>

          <fieldset id="from-saved" class="field" hidden>
            <legend data-i18n="fromSaved.title"></legend>
            <input id="from-saved-search" class="search" type="search" data-i18n-placeholder="saved.search" autocomplete="off" />
            <div id="from-saved-list" class="saved-list"></div>
            <p id="from-saved-empty" class="hint" hidden data-i18n="fromSaved.none"></p>
            <label class="field">
              <span class="field-label" data-i18n="fromSaved.upto"></span>
              <select id="from-saved-ply"></select>
            </label>
            <div class="segmented">
              <label><input type="radio" name="from-mode" value="line" checked /><span data-i18n="fromSaved.line"></span></label>
              <label><input type="radio" name="from-mode" value="position" /><span data-i18n="fromSaved.position"></span></label>
            </div>
            <p class="hint" id="from-saved-help"></p>
          </fieldset>

          <div class="field-row">
            <label class="field">
              <span class="field-label" data-i18n="setup.level"></span>
              <select id="level"></select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n="setup.timeControl"></span>
              <select id="time-control"></select>
            </label>
          </div>

          <fieldset class="field">
            <legend data-i18n="setup.pace"></legend>
            <div class="segmented">
              <label><input type="radio" name="pace" value="human" /><span data-i18n="setup.paceHuman"></span></label>
              <label><input type="radio" name="pace" value="instant" /><span data-i18n="setup.paceInstant"></span></label>
            </div>
          </fieldset>

          <div class="toggles">
            <label class="toggle"><input id="opt-warning" type="checkbox" /><span data-i18n="setup.warning"></span></label>
            <label class="toggle"><input id="opt-premoves" type="checkbox" /><span data-i18n="setup.premoves"></span></label>
            <label class="toggle" id="deviate-toggle"><input id="opt-deviate" type="checkbox" /><span data-i18n="setup.deviate"></span></label>
          </div>
          <div class="field-row" id="deviate-options" hidden>
            <label class="field">
              <span class="field-label" data-i18n="setup.deviateFrom"></span>
              <select id="deviate-from"></select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n="setup.deviateChance"></span>
              <select id="deviate-chance"></select>
            </label>
          </div>

          <button id="play" class="button button-primary button-wide" type="button" disabled data-i18n="setup.play"></button>
          <p id="setup-hint" class="hint" hidden data-i18n="setup.selectOne"></p>
        </section>


        </div>

        <footer class="footer">
          <span id="footer-versions"></span>
        </footer>
      </aside>

      <div id="resize-left" class="resizer resizer-left" role="separator" aria-orientation="vertical" tabindex="0"></div>
      <div id="resize-right" class="resizer resizer-right" role="separator" aria-orientation="vertical" tabindex="0"></div>

      <main class="board-area">
        <button id="toggle-left" class="bar-toggle bar-toggle-left" type="button"></button>
        <button id="toggle-right" class="bar-toggle bar-toggle-right" type="button"></button>
        <section class="board-column">
        <div class="player">
          <span id="top-name" class="player-name"></span>
          <span id="top-clock" class="clock" hidden></span>
        </div>
        <div class="board-holder">
          <div id="eval-bar" class="eval-bar" hidden>
            <div id="eval-fill" class="eval-fill"></div>
            <span id="eval-label" class="eval-label bottom"></span>
          </div>
          <div id="board" class="board"></div>
        </div>
        <div class="player">
          <span id="bottom-name" class="player-name"></span>
          <span id="bottom-clock" class="clock" hidden></span>
        </div>
        <div id="chips" class="chips" aria-live="polite"></div>
      </section>

      </main>

      <aside class="movebar">
        <div id="review-bar" class="review-bar" hidden>
          <button id="review-first" class="button button-ghost" type="button" data-i18n-title="review.first">⏮</button>
          <button id="review-prev" class="button button-ghost" type="button" data-i18n-title="review.prev">◀</button>
          <button id="review-next" class="button button-ghost" type="button" data-i18n-title="review.next">▶</button>
          <button id="review-last" class="button button-ghost" type="button" data-i18n-title="review.last">⏭</button>
          <button id="review-flip" class="button button-ghost" type="button" data-i18n-title="review.flip">⇅</button>
          <button id="review-play" class="button button-ghost" type="button" data-i18n="review.play"></button>
          <button id="review-close" class="button button-ghost" type="button" data-i18n-title="review.close">✕</button>
        </div>
        <label id="show-moves-option" class="toggle show-moves" hidden><input id="show-moves" type="checkbox" /><span data-i18n="moves.show"></span></label>
        <section id="opening-box" class="opening-box">
          <h2 data-i18n="moves.opening"></h2>
          <p id="opening-name" class="opening-title"></p>
        </section>
        <section id="moves-box" class="moves-box">
          <h2 data-i18n="game.moves"></h2>
          <div id="movelist" class="movelist"></div>
        </section>
        <section id="end-card" class="card end-card" hidden>
          <h2 id="end-result"></h2>
          <p id="end-termination" class="muted"></p>
          <dl class="end-facts">
            <dt data-i18n="end.variation"></dt>
            <dd id="end-variation"></dd>
            <dt data-i18n="end.theory"></dt>
            <dd id="end-theory"></dd>
          </dl>
          <h3 data-i18n="end.deviations"></h3>
          <ul id="end-deviations" class="deviations"></ul>
          <div class="button-row">
            <button id="copy-pgn" class="button" type="button" data-i18n="end.copyPgn"></button>
            <button id="download-pgn" class="button" type="button" data-i18n="end.downloadPgn"></button>
          </div>
        </section>
        <section id="game-card" class="card" hidden>
          <p id="game-error" class="error" role="alert" hidden></p>
          <div class="button-row">
            <button id="take-back" class="button" type="button" hidden disabled data-i18n="game.takeBack"></button>
            <button id="resign" class="button button-danger" type="button"></button>
          </div>
        </section>
        <div class="sidebar-controls">
          <button id="theme-toggle" class="button button-ghost" type="button"></button>
          <button id="sound-toggle" class="button button-ghost" type="button"></button>
          <input id="sound-volume" class="volume" type="range" min="0" max="1" step="0.05" />
        </div>
      </aside>
    </div>
  </body>
</html>
