# Chess glossary: Brazilian Portuguese (brief §8). One row per chess term the UI, Help, About and
# HOW_TO_INSTALL use, each from the Portuguese Wikipedia (`source`) or, when no page names it,
# `machine = true` with a `note`. `avoid` lists the words the UI must not use for the term.
# Every glossary has the terms of en.toml. Checked against Wikipedia on 2026-11-15 (#29).

