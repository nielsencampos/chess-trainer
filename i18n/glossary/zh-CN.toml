# Chess glossary: Simplified Chinese, China (brief §8). Machine-made and unreviewed: the terms of
# en-US.toml, each from the Chinese Wikipedia in its zh-cn variant (`source`) or, when no page
# names it, `machine = true` with a `note`. `avoid` lists the words the UI must not use for the
# term. The reader is addressed as "你". The Chinese Wikipedia translates opening names ("法兰西
# 防御", "王翼弃兵") and writes proper names in Chinese characters ("纳依道夫变着"), so no rule keeps
# an English proper name (`keep_names = false`). Digits stay Western (0-9). Moves keep the
# English piece letters (K Q R B N), as zh.wikipedia's notation article writes them (#36).

# Proper names are written in Chinese characters: a glossary rule never keeps an English one.
keep_names = false

