# Chess glossary: Indonesian (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Indonesian Wikipedia (`source`) or, when no page names it, `machine = true` with a
# `note`. `avoid` lists the words the UI must not use for the term. Each segment of an opening name
# is in title case, the noun before the name ("Pertahanan Sisilia"). The reader is addressed as
# "Anda". Surnames stay as the book spells them ("Chigorin", "Najdorf") unless Wikipedia names the
# opening. Every glossary has the terms of en-US.toml (#33).

