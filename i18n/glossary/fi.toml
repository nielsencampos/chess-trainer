# Chess glossary: Finnish (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Finnish Wikipedia or Wikidata (`source`) or, when no page names it, `machine = true` with
# a `note`. `avoid` lists the words the UI must not use for the term. Finnish joins a name and the
# word after it with a hyphen ("Najdorf-muunnelma"); the reader is addressed as "sinä". Surnames
# stay as the book spells them ("Chigorin", "Najdorf") unless Wikipedia names the opening. Every
# glossary has the terms of en-US.toml (#56).

