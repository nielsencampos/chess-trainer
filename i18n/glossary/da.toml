# Chess glossary: Danish (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each from
# the Danish Wikipedia or Wikidata (`source`) or, when no page names it, `machine = true` with a
# `note`. `avoid` lists the words the UI must not use for the term. Danish joins a name and the word
# after it, in the definite form ("Najdorfvarianten"); the reader is addressed as "du". Surnames
# stay as the book spells them ("Chigorin", "Najdorf") unless Wikipedia names the opening. Every
# glossary has the terms of en-US.toml (#56).

