# Chess glossary: Norwegian (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Norwegian Wikipedia or Wikidata (`source`) or, when no page names it, `machine = true`
# with a `note`. `avoid` lists the words the UI must not use for the term. Norwegian Bokmål (the
# Norwegian Wikipedia, no.wikipedia.org) joins a name and the word after it, in the definite form
# ("Tarraschforsvaret"); the reader is addressed as "du". Surnames stay as the book spells them
# ("Chigorin", "Najdorf") unless Wikipedia names the opening. Every glossary has the terms of
# en-US.toml (#56).

