# Chess glossary: Persian (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Persian Wikipedia or Wikidata (`source`) or, when no page names it, `machine = true` with
# a `note`. `avoid` lists the words the UI must not use for the term. The reader is addressed as
# "شما". The Persian Wikipedia writes proper names in Persian letters ("شاخه نایدورف"), so no rule
# keeps an English proper name (`keep_names = false`). Digits stay Western (0-9), as on the board
# (#37). Moves keep the English piece letters, as fa.wikipedia's notation article writes them.

# Proper names are written in Persian letters: a glossary rule never keeps an English one (brief §8).
