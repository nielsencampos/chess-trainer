# Chess glossary: Turkish (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Turkish Wikipedia (`source`) or, when no page names it, `machine = true` with a `note`.
# `avoid` lists the words the UI must not use for the term. Each segment of an opening name keeps
# the book's title case, the noun after the name with its Turkish suffix ("Caro-Kann Savunması").
# The reader is addressed as "siz". Surnames stay as the book spells them ("Chigorin", "Najdorf")
# unless Wikipedia names the opening. Every glossary has the terms of en-US.toml (#33).

# English words of the opening names this language translates: a glossary rule never
# keeps them as proper names, so names with one go to machine translation (brief §8).
