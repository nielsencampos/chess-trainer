# Chess glossary: Japanese (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Japanese Wikipedia (`source`) or, when no page names it, `machine = true` with a `note`.
# `avoid` lists the words the UI must not use for the term. The UI speaks in the polite です・ます
# form and does not address the reader as "あなた". The Japanese Wikipedia writes opening names as
# the English ones in katakana, their words joined by "・" ("フレンチ・ディフェンス"), proper names
# too ("ナイドルフ・ヴァリエーション"), so no rule keeps an English proper name (`keep_names =
# false`). Chess terms are the chess ones, not shogi's ("チェック", not "王手"). Digits stay Western
# (0-9). Moves keep the English piece letters (K Q R B N), as en.wikipedia's table gives them (#36).

# Proper names are written in katakana: a glossary rule never keeps an English one (brief §8).
keep_names = false

