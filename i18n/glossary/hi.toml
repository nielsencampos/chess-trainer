# Chess glossary: Hindi (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Hindi Wikipedia or Wikidata (`source`) or, when no page names it, `machine = true` with a
# `note`. `avoid` lists the words the UI must not use for the term. The reader is addressed as
# "आप". The Hindi Wikipedia writes opening names as the English ones in Devanagari ("सिसिलियन
# डिफ़ेंस", "इटालियन गेम"), except "उद्घाटन" (Opening) and "भिन्नता" (Variation), and writes
# proper names in Devanagari ("नायडॉर्फ़"), so no rule keeps an English proper name
# (`keep_names = false`). Digits stay Western (0-9). Every glossary has the terms of en-US.toml (#35).

# Proper names are written in Devanagari: a glossary rule never keeps an English one (brief §8).
