# Chess glossary: Korean (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Korean Wikipedia (`source`) or, when no page names it, `machine = true` with a `note`.
# `avoid` lists the words the UI must not use for the term. The UI speaks in the formal 합니다 form
# (requests in -하세요) and does not address the reader as "당신" or "너". The Korean Wikipedia
# writes opening names as the English ones in Hangul ("프렌치 디펜스"), proper names too ("드래곤
# 바리에이션"), so no rule keeps an English proper name (`keep_names = false`). Digits stay Western
# (0-9). Moves keep the English piece letters (K Q R B N), as ko.wikipedia's notation article
# writes them (#36).

# Proper names are written in Hangul: a glossary rule never keeps an English one (brief §8).
keep_names = false

