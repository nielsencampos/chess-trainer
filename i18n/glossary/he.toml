# Chess glossary: Hebrew (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Hebrew Wikipedia or Wikidata (`source`) or, when no page names it, `machine = true` with
# a `note`. `avoid` lists the words the UI must not use for the term. The UI gives instructions in
# the infinitive ("לבחור"), which has no gender. The Hebrew Wikipedia writes proper names in Hebrew
# letters ("הגנת קארו-קאן"), so no rule keeps an English proper name (`keep_names = false`). Moves
# keep the English piece letters, as he.wikipedia's notation article writes them (#37).

# Proper names are written in Hebrew letters: a glossary rule never keeps an English one (brief §8).
keep_names = false

