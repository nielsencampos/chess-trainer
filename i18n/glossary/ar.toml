# Chess glossary: Arabic (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Arabic Wikipedia or Wikidata (`source`) or, when no page names it, `machine = true` with a
# `note`. `avoid` lists the words the UI must not use for the term. The UI gives instructions in
# the masculine singular imperative, as software in Arabic does ("اختر"). The Arabic Wikipedia
# writes proper names in Arabic letters ("دفاع كارو-كان", "تغيير ناجدورف"), so no rule keeps an
# English proper name (`keep_names = false`). Digits stay Western (0-9), as on the board (#37).

# Proper names are written in Arabic letters: a glossary rule never keeps an English one (brief §8).
keep_names = false

