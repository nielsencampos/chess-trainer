# Chess glossary: Ukrainian (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Ukrainian Wikipedia (`source`) or, when no page names it, `machine = true` with a `note`.
# `avoid` lists the words the UI must not use for the term. The reader is addressed as "ви",
# lowercase. Ukrainian writes proper names in Cyrillic ("Найдорф"), and an opening named after a
# person takes the name in the genitive after the noun ("Варіант Найдорфа"), so no rule keeps an
# English proper name (`keep_names = false`). Every glossary has the terms of en-US.toml (#34).

# Proper names are written in Cyrillic: a glossary rule never keeps an English one (brief §8).
keep_names = false

