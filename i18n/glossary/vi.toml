# Chess glossary: Vietnamese (brief §8). Machine-made and unreviewed: the terms of en-US.toml, each
# from the Vietnamese Wikipedia (`source`) or, when no page names it, `machine = true` with a
# `note`. `avoid` lists the words the UI must not use for the term. Each segment of an opening name
# starts with a capital, the noun before the name ("Phòng thủ Sicilia"). The reader is addressed as
# "bạn". Surnames stay as the book spells them ("Chigorin", "Najdorf") unless Wikipedia names the
# opening. Every glossary has the terms of en-US.toml (#33).

