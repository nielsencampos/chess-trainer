vale = ["ChessTrainer", "Vi", "GlossaryVi", "UI"]
reviewed = false

[locales.sv]
direction = "ltr"
scripts = ["latin"]
languagetool = "sv"
vale = ["ChessTrainer", "Sv", "GlossarySv", "UI"]
reviewed = false

[locales.da]
