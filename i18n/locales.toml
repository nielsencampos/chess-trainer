scripts = ["latin"]
languagetool = "da-DK"
vale = ["ChessTrainer", "Da", "GlossaryDa", "UI"]
reviewed = false

[locales.nb]
direction = "ltr"
scripts = ["latin"]
vale = ["ChessTrainer", "Nb", "GlossaryNb", "UI"]
wikipedia = "no"
reviewed = false

[locales.fi]
direction = "ltr"
# "Azerbaidžanilainen": š and ž of loanwords and transliterated names are latin-ext.
scripts = ["latin", "latin-ext"]
vale = ["ChessTrainer", "Fi", "GlossaryFi", "UI"]
reviewed = false

[locales.ru]
direction = "ltr"
# Latin for the names the UI keeps (Stockfish, PGN, Chess960).
scripts = ["latin", "cyrillic"]
languagetool = "ru-RU"
vale = ["ChessTrainer", "Ru", "GlossaryRu", "UI"]
reviewed = false

[locales.uk]
direction = "ltr"
# Latin for the names the UI keeps (Stockfish, PGN, Chess960).
scripts = ["latin", "cyrillic"]
languagetool = "uk-UA"
vale = ["ChessTrainer", "Uk", "GlossaryUk", "UI"]
reviewed = false

[locales.hi]
direction = "ltr"
# Latin for the names the UI keeps (Stockfish, PGN, Chess960). LanguageTool has no Hindi.
scripts = ["latin", "devanagari"]
vale = ["ChessTrainer", "Hi", "GlossaryHi", "UI"]
reviewed = false

[locales.zh-CN]
direction = "ltr"
# Latin for the names the UI keeps (Stockfish, PGN, Chess960); the CJK text uses the system's
# fonts (brief §4.1). zh.wikipedia's titles mix Traditional and Simplified Chinese. LanguageTool's
# Chinese rules misread the chess words "着" (a move) and "步" (a count of moves): left out.
scripts = ["latin", "cjk"]
vale = ["ChessTrainer", "ZhCN", "GlossaryZhCN", "UI"]
wikipedia_variant = "zh-cn"
reviewed = false

[locales.ja]
direction = "ltr"
scripts = ["latin", "cjk"]
languagetool = "ja-JP"
vale = ["ChessTrainer", "Ja", "GlossaryJa", "UI"]
reviewed = false

[locales.ko]
direction = "ltr"
# LanguageTool has no Korean.
scripts = ["latin", "cjk"]
vale = ["ChessTrainer", "Ko", "GlossaryKo", "UI"]
reviewed = false

# Arabic: machine-made, unreviewed, right to left. Instructions in the masculine singular
# imperative, as software in Arabic does. Digits stay Western (0-9), as on the board and in PGN.
# LanguageTool's Arabic speller flags every Latin word, link and proper name: left out.
[locales.ar]
direction = "rtl"
# Latin for the names the UI keeps (Stockfish, PGN, Chess960).
scripts = ["latin", "arabic"]
vale = ["ChessTrainer", "Ar", "GlossaryAr", "UI"]
reviewed = false

# Persian: machine-made, unreviewed, right to left, in the Arabic script (Noto Sans Arabic has
# the Persian letters). The reader is "شما". Digits stay Western (0-9).
[locales.fa]
direction = "rtl"
scripts = ["latin", "arabic"]
languagetool = "fa"
vale = ["ChessTrainer", "Fa", "GlossaryFa", "UI"]
reviewed = false

# Hebrew: machine-made, unreviewed, right to left. Instructions in the infinitive, without gender.
# LanguageTool has no Hebrew.
[locales.he]
direction = "rtl"
scripts = ["latin", "hebrew"]
vale = ["ChessTrainer", "He", "GlossaryHe", "UI"]
reviewed = false
