name: Translation fix
description: Suggest a correction to a translation or opening name.
title: "Translation fix: "
labels: ["i18n"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      description: Give the language or locale code, such as pt-BR.
    validations:
      required: true
  - type: input
    id: key-or-name
    attributes:
      label: Translation key or opening name
      description: Give the key if you know it (for example, saved.count.other), or the opening name.
    validations:
      required: true
  - type: textarea
    id: current-text
    attributes:
      label: Current text
      description: Copy the text as it appears in Chess Trainer.
    validations:
      required: true
  - type: textarea
    id: suggested-text
    attributes:
      label: Suggested text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where it appears
      description: Give the screen or feature and any details that help us find the text.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (optional)
      description: Link to a reference for the suggested wording if you have one.
