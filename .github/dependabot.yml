# Weekly update PRs for the Python dependencies (uv) and the workflow actions. The base image is not
# here: it is named through an `ARG`, which Dependabot does not follow (`docker compose build --pull`
# updates it). Stockfish is not here either: the image resolves its latest release at build time.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
