# Vale style for the prose of Chess Trainer (scripts/vale.sh runs it, CI too).
StylesPath = .vale/styles
MinAlertLevel = error

# English docs.
[*.md]
BasedOnStyles = ChessTrainer, GlossaryEnUS

[*.pt-BR.md]
BasedOnStyles = ChessTrainer, PtBR, GlossaryPtBR
# Not the glossary's "game" or "move": a style of play, video games, and the touch-move saying.
TokenIgnores = (jogo posicional), (jogos de xadrez), (peça jogada)

[*.pt-PT.md]
BasedOnStyles = ChessTrainer, PtPT, GlossaryPtPT
# Not the glossary's "game" or "move": a style of play, video games, and the touch-move saying.
TokenIgnores = (jogo posicional), (jogos de xadrez), (peça jogada)

[*.es-419.md]
BasedOnStyles = ChessTrainer, Es, GlossaryEs419

[*.de.md]
BasedOnStyles = ChessTrainer, De, GlossaryDe

[*.fr.md]
BasedOnStyles = ChessTrainer, Fr, GlossaryFr
# Not the glossary's "game": a style of play, and video games.
TokenIgnores = (jeu positionnel), (jeux vidéo)

[*.it.md]
BasedOnStyles = ChessTrainer, It, GlossaryIt
# Not the glossary's "game": a style of play.
TokenIgnores = (gioco posizionale)

[*.en-GB.md]
BasedOnStyles = ChessTrainer, GlossaryEnGB

[*.es-ES.md]
BasedOnStyles = ChessTrainer, Es, GlossaryEsES

[*.tr.md]
BasedOnStyles = ChessTrainer, Tr, GlossaryTr

[*.pl.md]
BasedOnStyles = ChessTrainer, Pl, GlossaryPl

[*.nl.md]
BasedOnStyles = ChessTrainer, Nl, GlossaryNl
# "opening" is the Dutch word too.
TokenIgnores = (?<![.\w])[Oo]pening(?:en)?\b

[*.id.md]
BasedOnStyles = ChessTrainer, Id, GlossaryId

[*.vi.md]
BasedOnStyles = ChessTrainer, Vi, GlossaryVi

[*.sv.md]
BasedOnStyles = ChessTrainer, Sv, GlossarySv

[*.da.md]
BasedOnStyles = ChessTrainer, Da, GlossaryDa

[*.nb.md]
BasedOnStyles = ChessTrainer, Nb, GlossaryNb

[*.fi.md]
BasedOnStyles = ChessTrainer, Fi, GlossaryFi

# UI strings and README sections, exported by scripts/check_text.py --export (see scripts/vale.sh).
# The export adds a section per UI file with its language's styles from i18n/locales.toml; these
# only add what is not a style.
[.cache/vale/ui.pt-BR.md]
# The author's own words on the About page, and the exceptions of [*.pt-BR.md].
TokenIgnores = (dados e backend), (jogo posicional), (jogos de xadrez), (peça jogada)

[.cache/vale/ui.es-419.md]
# The author's own words on the About page.
TokenIgnores = (datos y backend)

[.cache/vale/ui.es-ES.md]
# The author's own words on the About page.
TokenIgnores = (datos y backend)

[.cache/vale/ui.pt-PT.md]
