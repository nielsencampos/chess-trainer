# Vale style for the prose of Chess Trainer (scripts/vale.sh runs it, CI too).
StylesPath = .vale/styles
MinAlertLevel = error

# English docs.
[*.md]
BasedOnStyles = ChessTrainer, GlossaryEn

[*.pt-BR.md]
BasedOnStyles = ChessTrainer, PtBR, GlossaryPtBR
# Not the glossary's "game" or "move": a style of play, video games, and the touch-move saying.
TokenIgnores = (jogo posicional), (jogos de xadrez), (peça jogada)

[*.pt-PT.md]
BasedOnStyles = ChessTrainer, PtPT, GlossaryPtPT
# Not the glossary's "game" or "move": a style of play, video games, and the touch-move saying.
TokenIgnores = (jogo posicional), (jogos de xadrez), (peça jogada)

[*.es.md]
BasedOnStyles = ChessTrainer, Es, GlossaryEs

[*.de.md]
BasedOnStyles = ChessTrainer, De, GlossaryDe

[*.en-GB.md]
BasedOnStyles = ChessTrainer, GlossaryEnGB

[*.es-ES.md]
BasedOnStyles = ChessTrainer, Es, GlossaryEsES

# UI strings and README sections, exported by scripts/check_text.py --export (see scripts/vale.sh).
# The export adds a section per UI file with its language's styles from i18n/locales.toml; these
# only add what is not a style.
[.cache/vale/ui.pt-BR.md]
# The author's own words on the About page, and the exceptions of [*.pt-BR.md].
TokenIgnores = (dados e backend), (jogo posicional), (jogos de xadrez), (peça jogada)

[.cache/vale/ui.es.md]
# The author's own words on the About page.
TokenIgnores = (datos y backend)

[.cache/vale/ui.es-ES.md]
# The author's own words on the About page.
TokenIgnores = (datos y backend)

[.cache/vale/ui.pt-PT.md]
# The author's own words on the About page, and the exceptions of [*.pt-PT.md].
TokenIgnores = (dados e backend), (jogo posicional), (jogos de xadrez), (peça jogada)

[.cache/vale/ui.de.md]
# The author's own words on the About page.
TokenIgnores = (Daten- und Backend-Ingenieur)
