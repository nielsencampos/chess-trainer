# Vale style for the prose of Chess Trainer (scripts/vale.sh runs it, CI too).
StylesPath = .vale/styles
MinAlertLevel = error

# English docs.
[*.md]
BasedOnStyles = ChessTrainer

[*.pt-BR.md]
BasedOnStyles = ChessTrainer, PtBR

[*.es.md]
BasedOnStyles = ChessTrainer, Es

# UI strings and README sections, exported by scripts/check_text.py --export (see scripts/vale.sh).
[.cache/vale/ui.pt-BR.md]
BasedOnStyles = ChessTrainer, PtBR, UI
# The author's own words on the About page.
TokenIgnores = (dados e backend)

[.cache/vale/ui.es.md]
BasedOnStyles = ChessTrainer, Es, UI
# The author's own words on the About page.
TokenIgnores = (datos y backend)
