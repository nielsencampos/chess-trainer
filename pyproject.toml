[project]
name = "chess-trainer"
version = "0.6.0"
description = "Opening trainer you run on your own computer: a bot plays your repertoire, Stockfish takes over when theory ends, and every game is saved to review. Real clocks, Chess960, PGN, Chess.com and Lichess import. Multilingual. Docker or desktop app, no accounts."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11,<2",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
desktop = [
    "platformdirs>=4",
    "pyinstaller>=6",
    "pywebview>=6 ; sys_platform != 'linux'",
    "pywebview[qt]>=6 ; sys_platform == 'linux'",
]
dev = [
    "codespell>=2.4.3",
    "httpx>=0.27",
    "pillow>=13.0.0",
    "pytest>=8",
    "pytest-playwright>=0.6",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not engine and not e2e' --strict-markers"
markers = [
    "engine: needs a real Stockfish binary (STOCKFISH_PATH)",
    "e2e: Playwright browser flows against a running app (E2E_BASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]

# Every module, class and function has a docstring with Args, Returns and Raises (Google style).
[tool.ruff.lint.pydocstyle]
convention = "google"

# Spelling of code, comments and docstrings (scripts/check_text.py checks the prose).
[tool.codespell]
skip = "./.venv,./.cache,./build,./data,./catalog/data,./openings,./evals,./web/js/vendor,./web/fonts,./web/pieces,./web/help,*.lock,*.svg,*.webp,*.png,*.pt-BR.*,*.es-419.*,README.md,README.*.md,HOW_TO_INSTALL.*.md,./i18n/docs,./docs,./web/i18n,./i18n/glossary/pt-BR.toml,./i18n/glossary/pt-PT.toml,./i18n/glossary/de.toml,./i18n/glossary/fr.toml,./i18n/glossary/it.toml,./i18n/glossary/es-419.toml,./i18n/glossary/es-ES.toml,./i18n/glossary/tr.toml,./i18n/glossary/pl.toml,./i18n/glossary/nl.toml,./i18n/glossary/id.toml,./i18n/glossary/vi.toml,./i18n/glossary/sv.toml,./i18n/glossary/da.toml,./i18n/glossary/nb.toml,./i18n/glossary/fi.toml,./i18n/glossary/ru.toml,./i18n/glossary/uk.toml,./i18n/names,./i18n/wikipedia.json"
# PyInstaller's `datas`, a name, Spanish and Portuguese words the tests quote, and Turkish "siz".
ignore-words-list = "datas,flor,variante,oficial,siz"
