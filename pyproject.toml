[project]
name = "chess-trainer"
version = "0.5.0"
description = "Local chess trainer: play Stockfish, drill your openings and review your games, all in one Docker image."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11,<2",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
desktop = [
    "platformdirs>=4",
    "pyinstaller>=6",
    "pywebview>=6 ; sys_platform != 'linux'",
    "pywebview[qt]>=6 ; sys_platform == 'linux'",
]
dev = [
    "codespell>=2.4.3",
    "httpx>=0.27",
    "pillow>=13.0.0",
    "pytest>=8",
    "pytest-playwright>=0.6",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not engine and not e2e' --strict-markers"
markers = [
    "engine: needs a real Stockfish binary (STOCKFISH_PATH)",
    "e2e: Playwright browser flows against a running app (E2E_BASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]

# Every module, class and function has a docstring with Args, Returns and Raises (Google style).
[tool.ruff.lint.pydocstyle]
convention = "google"

# Spelling of code, comments and docstrings (scripts/check_text.py checks the prose).
[tool.codespell]
skip = "./.venv,./.cache,./build,./data,./catalog/data,./openings,./evals,./web/js/vendor,./web/fonts,./web/pieces,./web/help,*.lock,*.svg,*.webp,*.png,*.pt-BR.*,*.es.*,README.md,./docs,./web/i18n"
# PyInstaller's `datas`, a name, and Spanish and Portuguese words the tests quote.
ignore-words-list = "datas,flor,variante,oficial"
