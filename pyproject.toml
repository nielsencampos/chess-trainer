[project]
name = "chess-trainer"
version = "0.1.0"
description = "Local chess trainer: play Stockfish, drill your openings and review your games, all in one Docker image."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11,<2",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pillow>=13.0.0",
    "pytest>=8",
    "pytest-playwright>=0.6",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not engine and not e2e' --strict-markers"
markers = [
    "engine: needs a real Stockfish binary (STOCKFISH_PATH)",
    "e2e: Playwright browser flows against a running app (E2E_BASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]

# Every module, class and function has a docstring with Args, Returns and Raises (Google style).
[tool.ruff.lint.pydocstyle]
convention = "google"
